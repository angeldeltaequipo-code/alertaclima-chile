# Publica el sitio de ZUMI y la app en GitHub Pages cada vez que se sube un cambio a "main".
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada miércoles se vuelve a publicar: así salen solos los artículos del blog que llegaron a su fecha.
  schedule:
    - cron: '17 13 * * 3'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      # Control de calidad: si ZUMI empeora en su examen, no se publica.
      - name: Revisión de código (variables sin definir, claves duplicadas, reglas de hooks)
        run: cd client && npx oxlint
      - name: Examen de ZUMI
        run: node scripts/evaluar-zumi.mjs --minimo 90 && node scripts/evaluar-zumi.mjs --ciega
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          # Dirección del servidor de reportes (variable API_URL del repositorio; si no existe, la de Render).
          VITE_API_URL: ${{ vars.API_URL || 'https://alertaclima-api.onrender.com' }}
          # Claves públicas del SDK de RevenueCat (compras dentro de la app de iPhone y Android).
          VITE_RC_IOS: ${{ vars.REVENUECAT_IOS }}
          VITE_RC_ANDROID: ${{ vars.REVENUECAT_ANDROID }}
      # Sitio: la página de ZUMI en la raíz (zumichile.com) y la app en zumichile.com/app/
      - name: Armar el sitio (página de ZUMI + app en /app/)
        run: |
          mkdir -p _sitio
          cp -r client/sitio/. _sitio/
          cp -r client/dist _sitio/app
          cp client/dist/privacidad.html client/dist/terminos.html _sitio/
          test -f _sitio/index.html && test -f _sitio/app/index.html
      - name: Blog, sitemap y robots
        run: node client/scripts/blog.mjs client/blog _sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
