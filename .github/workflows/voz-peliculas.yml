name: Voz de las películas de ZUMI
# Pide al servidor la voz única de ZUMI (Gemini) para los textos de las películas y la deja como artefacto.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  voz:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir audios
        run: |
          mkdir voz
          curl -sf -m 90 https://alertaclima-api.onrender.com/api/voz/estado || true
          pedir() { for k in 1 2 3; do curl -sf -m 60 -G --data-urlencode "t=$2" --data-urlencode "matiz=escena" https://alertaclima-api.onrender.com/api/voz -o "voz/$1.wav" && return 0; sleep 10; done; return 1; }
          pedir hola '¡Hola, hola! ¡Soy ZUMI! Desde hoy cuido el clima de tu casa y de toda tu familia. ¿Listo? ¡Vamos!'
          pedir lluvia '¡Uy, se viene la lluvia! Paraguas, chaqueta y botas… ¡y antes de salir, revisa las alertas en la app!'
          pedir calor '¡Qué calor! Toma mucha agua, usa bloqueador y busca la sombra, sobre todo al mediodía.'
          pedir sismo 'Si tiembla: agáchate, cúbrete y afírmate. Cuando pase, revisa a tu familia y sigue a Senapred.'
          pedir mochila '¡Agua, linterna, radio, pilas y tus remedios! Una mochila lista te puede salvar el día.'
          ls -la voz
      - name: Guardar en la rama voz-peliculas
        run: |
          cd voz
          git init -q -b voz-peliculas
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "Voz de las películas"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voz-peliculas
