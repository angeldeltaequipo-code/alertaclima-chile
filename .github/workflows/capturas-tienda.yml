# Toma capturas de la app publicada para las fichas de las tiendas y las sube como artefacto.
name: Capturas para las tiendas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd client && npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: cd client && node scripts/capturas-tienda.mjs "https://zumichile.com/app/" /tmp/capturas
      - name: Guardar en tienda/crudas
        run: |
          mkdir -p tienda/crudas && cp /tmp/capturas/*.png tienda/crudas/
          git config user.name "ZUMI capturas"
          git config user.email "actions@github.com"
          git add tienda/crudas
          git diff --cached --quiet && exit 0
          git commit -m "Capturas de la app para las tiendas"
          git pull --rebase -q origin main && git push
