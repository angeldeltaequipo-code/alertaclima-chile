name: Verificar que todo funcione
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar cada parte contra el servidor real
        run: node server/scripts/verificar-api.mjs "${{ vars.API_URL || 'https://alertaclima-api.onrender.com' }}"
