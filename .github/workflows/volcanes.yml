# Actualiza a diario el reporte de volcanes de Chile (el Smithsonian bloquea los pedidos desde Render).
name: Volcanes

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node server/scripts/volcanes.mjs
      - name: Publicar si cambió
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain client/public/datos)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add client/public/datos/volcanes.json
            git commit -m "Volcanes: reporte semanal actualizado"
            git push
            gh workflow run publicar.yml
          fi
