# Despliegue completo en Render (Blueprint): servidor + base de datos PostgreSQL.
# Render conecta ambos solo; no hay que copiar ni pegar claves.
services:
  - type: web
    name: alertaclima-api
    runtime: node
    plan: free # Para el piloto real: un plan pagado, que no se duerme tras 15 min sin uso.
    region: virginia
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && node scripts/migrar.js && node scripts/sembrar-comunas.js --si-vacia && node index.js
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: alertaclima-db
          property: connectionString
      - key: HASH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://angeldeltaequipo-code.github.io
      - key: TRUST_PROXY
        value: 'true'
      - key: ADMIN_TOKEN # Clave del panel de alertas (…/#admin). Render la genera; se ve en Environment.
        generateValue: true
      - key: ALERTA_HORAS_SIN_CONFIRMAR
        value: '12'
      - key: SESSION_SECRET # Firma de las sesiones de la app (inicio con Google). Render la genera.
        generateValue: true
      - key: GOOGLE_CLIENT_ID # ID de cliente OAuth de Google (público). Sin él, el inicio de sesión queda apagado.
        sync: false
      - key: RESEND_API_KEY # Clave de Resend para el correo de bienvenida. Sin ella no se envían correos.
        sync: false
      - key: ANTHROPIC_API_KEY # Clave de la API de Claude para que ZUMI converse con IA. Sin ella, ZUMI usa respuestas propias.
        sync: false
      - key: REDDIT_CLIENT_ID # App gratuita de Reddit (tipo script) para leer r/chile desde el servidor. Opcional.
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: FCM_CREDENCIALES # JSON de cuenta de servicio de Firebase: notificaciones de la app de App Store y Google Play.
        sync: false
      - key: COBRO_ACTIVO # "true" muestra precios y límites del plan Familia. Mientras no, todo funciona como siempre.
        value: "false"
      - key: PRECIO_MENSUAL_CLP
        value: "1990"
      - key: PRECIO_ANUAL_CLP
        value: "14990"
      - key: PRUEBA_DIAS
        value: "7"
      - key: MP_ACCESS_TOKEN # Mercado Pago → Tus integraciones → Credenciales de producción (Access Token)
        sync: false
      - key: MP_WEBHOOK_SECRET # Mercado Pago → Webhooks → clave secreta (para verificar los avisos de pago)
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET # El mismo texto que pongas como "Authorization header" en el webhook de RevenueCat
        sync: false
      - key: X_BEARER_TOKEN # API de X (Twitter), de pago. Opcional.
        sync: false
      - key: CORREO_DESDE # Remitente de un dominio verificado en Resend, p. ej. "AlertaClima <hola@tudominio.cl>"
        sync: false

databases:
  - name: alertaclima-db
    plan: free # Gratis por 30 días; después hay que pasarla a un plan pagado para no perder los datos.
    region: virginia
    databaseName: alertaclima
    user: alertaclima
