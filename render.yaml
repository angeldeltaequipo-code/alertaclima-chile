# Despliegue del servidor en Render (Blueprint). La base de datos vive en Neon (PostGIS incluido).
services:
  - type: web
    name: alertaclima-api
    runtime: node
    plan: free # Para producción: un plan pagado, que no se duerme tras 15 min sin uso.
    region: virginia
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && node scripts/migrar.js && node scripts/sembrar-comunas.js --si-vacia && node index.js
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Se pega a mano: la cadena de conexión de Neon
      - key: HASH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://angeldeltaequipo-code.github.io
      - key: TRUST_PROXY
        value: 'true'
