<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Soporte ZUMI · Bandeja de Angel</title>
<meta name="theme-color" content="#0f1d2e">
<link rel="icon" href="/app/icono.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Archivo';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(/fuentes/archivo.woff2) format('woff2')}
:root{--noche:#0f1d2e;--noche-2:#16283d;--glaciar:#eef3f6;--tinta:#14202c;--pizarra:#536577;--linea:#d5dfe6;--panda:#c8501f;--verde:#1e7a4c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'Archivo',system-ui,sans-serif;background:var(--glaciar);color:var(--tinta);font-size:16px}
button,input,textarea{font:inherit}
:focus-visible{outline:3px solid var(--panda);outline-offset:2px}
.entrar{max-width:420px;margin:12vh auto;padding:28px;background:#fff;border-radius:22px;border:1px solid var(--linea)}
.entrar img{width:72px;height:72px;border-radius:50%}
.entrar h1{font-size:30px;font-variation-settings:'wdth' 70;margin:14px 0 6px}
.entrar p{color:var(--pizarra);margin:0 0 18px;line-height:1.5}
.entrar input{width:100%;padding:13px 14px;border:1px solid var(--linea);border-radius:12px;font-size:16px}
.btn{border:0;border-radius:999px;background:var(--panda);color:#fff;font-weight:750;padding:12px 20px;cursor:pointer}
.entrar .btn{margin-top:12px;width:100%}
.error{color:#b42318;font-weight:600;margin-top:10px;min-height:1.2em}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
.lista{background:#fff;border-right:1px solid var(--linea);display:flex;flex-direction:column;min-height:0}
.lista header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--noche);color:#fff}
.lista header img{width:38px;height:38px;border-radius:50%}
.lista header b{font-size:18px}
.lista header small{display:block;color:#7fd3a5;font-size:12.5px}
.lista header button{margin-left:auto;background:transparent;border:1px solid #2b3f55;color:#cfdae4;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.convs{overflow-y:auto;flex:1}
.conv{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);background:#fff;padding:14px 16px;cursor:pointer}
.conv:hover{background:#f6f9fb}
.conv.activa{background:#fff3ec}
.conv .fila{display:flex;justify-content:space-between;gap:8px}
.conv b{font-size:15.5px}
.conv time{font-size:12.5px;color:var(--pizarra);flex:none}
.conv p{margin:4px 0 0;color:var(--pizarra);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .nuevo{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--panda);color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px;padding:0 6px;margin-left:6px}
.vacio{padding:30px 18px;color:var(--pizarra);text-align:center;line-height:1.5}
.hilo{display:flex;flex-direction:column;min-height:0}
.hilo header{padding:14px 18px;background:#fff;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:12px}
.hilo header .volver{display:none;border:0;background:transparent;font-size:24px;cursor:pointer;padding:0 6px}
.hilo header b{display:block;font-size:17px}
.hilo header span{font-size:13.5px;color:var(--pizarra)}
.mensajes{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:72%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.m small{display:block;font-size:11.5px;opacity:.7;margin-top:3px}
.m.visita{align-self:flex-start;background:#fff;border-radius:18px 18px 18px 6px;box-shadow:0 1px 2px rgba(15,29,46,.08)}
.m.angel{align-self:flex-end;background:var(--noche);color:#fff;border-radius:18px 18px 6px 18px}
.atajos{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
.atajos button{flex:none;border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
form.responder{display:flex;gap:8px;padding:12px 14px 14px;align-items:flex-end}
form.responder textarea{flex:1;resize:none;border:1px solid var(--linea);border-radius:18px;padding:11px 14px;font-size:16px;max-height:160px;min-height:46px}
.nada{margin:auto;color:var(--pizarra);text-align:center;padding:20px}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .app.viendo .lista{display:none}
  .app:not(.viendo) .hilo{display:none}
  .hilo header .volver{display:block}
  .m{max-width:86%}
}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
;(function () {
  var API = (function () { try { return localStorage.getItem('zumi:api') } catch (e) { return null } })() || 'https://alertaclima-api.onrender.com'
  var raiz = document.getElementById('raiz')
  var clave = ''; try { clave = localStorage.getItem('zumi:admin') || '' } catch (e) {}
  var convs = [], actual = location.hash.slice(1) || null, ultimo = 0, conocidos = {}, primera = true
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  var cuando = function (iso) {
    var d = new Date(iso), hoy = new Date()
    return d.toDateString() === hoy.toDateString() ? d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }) : d.toLocaleDateString('es-CL', { day: 'numeric', month: 'short' })
  }
  var ATAJOS = [
    '¡Hola! Gracias por escribir, soy Angel. ¿En qué te ayudo?',
    'Ya lo revisé y está arreglado. ¿Me confirmas si ahora te funciona?',
    '¿Me dices qué teléfono usas (iPhone o Android) y en qué comuna estás?',
    'Gracias por la idea, la anoto para las próximas versiones de ZUMI.',
    'Cualquier otra cosa, escríbeme por aquí. ¡Un abrazo!',
  ]
  function api(ruta, cuerpo) {
    return fetch(API + '/api/soporte/admin' + ruta, {
      method: cuerpo ? 'POST' : 'GET',
      headers: Object.assign({ authorization: 'Bearer ' + clave }, cuerpo ? { 'content-type': 'application/json' } : {}),
      body: cuerpo ? JSON.stringify(cuerpo) : undefined,
    }).then(function (r) { return r.json().then(function (d) { if (!r.ok) { var e = new Error(d.error || 'Error'); e.estado = r.status; throw e } return d }) })
  }
  function pantallaEntrar(error) {
    raiz.innerHTML = '<form class="entrar"><img src="/img/angel-320.webp" alt=""><h1>Bandeja de soporte</h1><p>Aquí respondes los mensajes que llegan al chat de zumichile.com. Entra con la clave de administración de ZUMI (la variable ADMIN_TOKEN del servidor en Render).</p><label for="clave" style="font-weight:700;display:block;margin-bottom:6px">Clave de administración</label><input id="clave" type="password" autocomplete="current-password" required><button class="btn" type="submit">Entrar</button><p class="error" role="alert">' + esc(error || '') + '</p></form>'
    raiz.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault()
      clave = raiz.querySelector('#clave').value.trim()
      api('').then(function (d) { try { localStorage.setItem('zumi:admin', clave) } catch (x) {} ; convs = d.conversaciones; montar() })
        .catch(function (x) { pantallaEntrar(x.estado === 401 ? 'Esa clave no es correcta.' : 'El servidor no respondió. Si estaba dormido, espera 30 segundos y vuelve a intentar.') })
    })
  }
  function montar() {
    raiz.innerHTML = '<div class="app"><aside class="lista"><header><img src="/img/angel.webp" alt=""><div><b>Soporte ZUMI</b><small>En línea: la gente te ve conectado</small></div><button type="button" id="avisos">Activar avisos</button></header><div class="convs"></div></aside><main class="hilo"><div class="nada">Elige una conversación.</div></main></div>'
    var b = raiz.querySelector('#avisos')
    if (!('Notification' in window) || Notification.permission === 'granted') b.hidden = true
    b.addEventListener('click', function () { Notification.requestPermission().then(function (p) { b.hidden = p === 'granted' }) })
    pintarLista()
    if (actual) abrir(actual)
    setInterval(refrescar, 5000)
  }
  function pintarLista() {
    var caja = raiz.querySelector('.convs'); if (!caja) return
    if (!convs.length) { caja.innerHTML = '<p class="vacio">Todavía no hay mensajes. Cuando alguien escriba en el chat de zumichile.com, aparece aquí.</p>'; return }
    caja.innerHTML = ''
    convs.forEach(function (c) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'conv' + (c.id === actual ? ' activa' : '')
      var quien = c.nombre || c.contacto || 'Visita ' + c.id.slice(0, 4)
      b.innerHTML = '<div class="fila"><b>' + esc(quien) + (c.sin_leer ? '<span class="nuevo">' + c.sin_leer + '</span>' : '') + '</b><time>' + cuando(c.actualizada_en) + '</time></div><p>' + (c.ultimo && c.ultimo.autor === 'angel' ? 'Tú: ' : '') + esc(c.ultimo ? c.ultimo.texto : '') + '</p>'
      b.addEventListener('click', function () { abrir(c.id) })
      caja.appendChild(b)
    })
  }
  function avisar(c) {
    try {
      var a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain()
      o.frequency.value = 740; g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.1, a.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.6)
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + 0.65)
    } catch (e) {}
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
      var n = new Notification((c.nombre || 'Alguien') + ' te escribió', { body: c.ultimo ? c.ultimo.texto : '', icon: '/img/angel.webp', tag: c.id })
      n.onclick = function () { window.focus(); abrir(c.id) }
    }
  }
  function refrescar() {
    api('').then(function (d) {
      d.conversaciones.forEach(function (c) {
        var k = c.ultimo ? c.ultimo.id : 0
        if (!primera && c.ultimo && c.ultimo.autor === 'visita' && conocidos[c.id] !== k) avisar(c)
        conocidos[c.id] = k
      })
      primera = false
      convs = d.conversaciones
      var sin = convs.reduce(function (s, c) { return s + (c.id === actual ? 0 : c.sin_leer) }, 0)
      document.title = (sin ? '(' + sin + ') ' : '') + 'Soporte ZUMI · Bandeja de Angel'
      pintarLista()
      if (actual) traer()
    }).catch(function (e) { if (e.estado === 401) { try { localStorage.removeItem('zumi:admin') } catch (x) {} ; pantallaEntrar('La clave cambió. Vuelve a entrar.') } })
  }
  function abrir(id) {
    actual = id; ultimo = 0
    history.replaceState(null, '', '#' + id)
    raiz.querySelector('.app').classList.add('viendo')
    var c = convs.find(function (x) { return x.id === id }) || { id: id }
    var hilo = raiz.querySelector('.hilo')
    hilo.innerHTML = '<header><button type="button" class="volver" aria-label="Volver a la lista">‹</button><div><b>' + esc(c.nombre || 'Visita ' + id.slice(0, 4)) + '</b><span>' + esc([c.contacto, c.pagina ? 'desde ' + c.pagina : ''].filter(Boolean).join(' · ')) + '</span></div></header><div class="mensajes"></div><div class="atajos"></div><form class="responder"><textarea rows="1" placeholder="Responde como Angel…" aria-label="Tu respuesta" maxlength="2000"></textarea><button class="btn" type="submit">Enviar</button></form>'
    hilo.querySelector('.volver').addEventListener('click', function () { actual = null; history.replaceState(null, '', '#'); raiz.querySelector('.app').classList.remove('viendo'); pintarLista() })
    var at = hilo.querySelector('.atajos'), ta = hilo.querySelector('textarea')
    ATAJOS.forEach(function (t) { var b = document.createElement('button'); b.type = 'button'; b.textContent = t.length > 34 ? t.slice(0, 32) + '…' : t; b.title = t; b.addEventListener('click', function () { ta.value = t; ta.focus() }); at.appendChild(b) })
    ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); hilo.querySelector('form').requestSubmit() } })
    ta.addEventListener('input', function () { ta.style.height = ''; ta.style.height = Math.min(160, ta.scrollHeight) + 'px' })
    hilo.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault()
      var t = ta.value.trim(); if (!t) return
      ta.value = ''; ta.style.height = ''
      api('/' + id + '/mensajes', { texto: t }).then(traer).catch(function () { ta.value = t; alert('No se envió. Revisa tu conexión e intenta de nuevo.') })
    })
    pintarLista(); traer()
    if (matchMedia('(min-width: 761px)').matches) ta.focus()
  }
  function traer() {
    var id = actual
    api('/' + id + '?desde=' + ultimo).then(function (d) {
      if (id !== actual) return
      var caja = raiz.querySelector('.mensajes'); if (!caja) return
      d.mensajes.forEach(function (m) {
        ultimo = Math.max(ultimo, m.id)
        var p = document.createElement('div'); p.className = 'm ' + m.autor
        p.textContent = m.texto
        var s = document.createElement('small'); s.textContent = cuando(m.creado_en); p.appendChild(s)
        caja.appendChild(p)
      })
      if (d.mensajes.length) caja.scrollTop = caja.scrollHeight
      var c = convs.find(function (x) { return x.id === id }); if (c) c.sin_leer = 0
    }).catch(function () {})
  }
  if (clave) api('').then(function (d) { convs = d.conversaciones; d.conversaciones.forEach(function (c) { conocidos[c.id] = c.ultimo ? c.ultimo.id : 0 }); primera = false; montar() }).catch(function (e) { pantallaEntrar(e.estado === 401 ? '' : 'El servidor no respondió. Si estaba dormido, espera 30 segundos y recarga.') })
  else pantallaEntrar()
})()
</script>
</body>
</html>
